name: HGVC Binder iPhone app

on:
  push:
    branches: [main]
    paths: ["hgvc-binder/**", "native/hgvc-binder/**", "tests/hgvc-binder.test.js", ".github/workflows/hgvc-binder-ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the points, fees, reminders and statement logic
        run: node tests/hgvc-binder.test.js

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Create the Xcode project
        working-directory: native/hgvc-binder
        run: xcodegen generate

      - name: Run tests and take screenshots on an iPhone simulator
        working-directory: native/hgvc-binder
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "::notice::Simulator: $DEVICE"
          xcodebuild test -project HGVCBinder.xcodeproj -scheme HGVCBinder \
            -destination "platform=iOS Simulator,name=$DEVICE" -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -E "Executed [0-9]+ test" test.log | sort -u | while IFS= read -r l; do echo "::notice::$l"; done
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" test.log; then
            grep -E "error:|: error|failed|xcodebuild: error" test.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Publish screenshots to the ci-screenshots-hgvcbinder branch
        if: always()
        working-directory: native/hgvc-binder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d TestResults.xcresult ] || exit 0
          mkdir -p shots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots || true
          cd shots
          git init -q -b ci-screenshots-hgvcbinder
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from run ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screenshots-hgvcbinder

      - name: Build for iPhone (unsigned)
        working-directory: native/hgvc-binder
        run: |
          xcodebuild build -project HGVCBinder.xcodeproj -scheme HGVCBinder \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then
            grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Package the .ipa
        working-directory: native/hgvc-binder
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/HGVCBinder.app Payload/
          zip -qry HGVC-Binder.ipa Payload && ls -l HGVC-Binder.ipa

      - name: Publish the .ipa (always at the same download link)
        working-directory: native/hgvc-binder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hgvc-binder-latest --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create hgvc-binder-latest HGVC-Binder.ipa --repo "${{ github.repository }}" \
            --title "HGVC Binder (build ${{ github.run_number }})" --latest=false \
            --notes "Download HGVC-Binder.ipa below and install it with Sideloadly. Built from commit ${GITHUB_SHA:0:7}."

      # ---- TestFlight: sign with your paid Apple Developer account and upload to App Store Connect ----
      # Needs four repository secrets (Settings > Secrets and variables > Actions):
      #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole AuthKey_XXXX.p8 text), APPLE_TEAM_ID
      # If any are missing, these steps are skipped and the Sideloadly .ipa above still works.
      - name: Check for App Store Connect secrets
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped: App Store Connect secrets are not set yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive for the App Store
        if: steps.asc.outputs.ready == 'true'
        working-directory: native/hgvc-binder
        run: |
          # Each upload needs a higher build number; the GitHub run number always goes up.
          xcodebuild archive -project HGVCBinder.xcodeproj -scheme HGVCBinder \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/HGVCBinder.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          if ! grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log; then
            grep -E "error:" archive.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Sign and upload to TestFlight
        if: steps.asc.outputs.ready == 'true'
        working-directory: native/hgvc-binder
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/HGVCBinder.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log | grep -E "error:|Upload|EXPORT" || true
          if ! grep -qE "\*\* EXPORT SUCCEEDED \*\*|Upload succeeded" upload.log; then
            grep -iE "error" upload.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi
          echo "::notice::Build ${{ github.run_number }} uploaded to App Store Connect. It shows up in TestFlight after Apple finishes processing (usually 10-30 minutes)."
