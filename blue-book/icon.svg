<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3d73"/>
      <stop offset="1" stop-color="#0c1f42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8e"/>
      <stop offset="0.55" stop-color="#d7aa45"/>
      <stop offset="1" stop-color="#a87a22"/>
    </linearGradient>
    <pattern id="cloth" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- background -->
  <rect width="1024" height="1024" fill="#0a1830"/>
  <!-- page edges peeking out at the right -->
  <rect x="236" y="150" width="640" height="736" rx="22" fill="#efe6cf"/>
  <g stroke="#b9ab88" stroke-width="5">
    <line x1="840" y1="190" x2="840" y2="846"/>
    <line x1="856" y1="200" x2="856" y2="836"/>
  </g>
  <!-- book cover -->
  <rect x="148" y="128" width="690" height="768" rx="30" fill="url(#cover)"/>
  <rect x="148" y="128" width="690" height="768" rx="30" fill="url(#cloth)"/>
  <!-- spine band -->
  <rect x="148" y="128" width="78" height="768" rx="30" fill="#0a1a38"/>
  <rect x="200" y="128" width="26" height="768" fill="#0a1a38"/>
  <line x1="226" y1="128" x2="226" y2="896" stroke="#06122a" stroke-width="6"/>
  <!-- gold border -->
  <rect x="268" y="176" width="526" height="672" rx="10" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <!-- Naval Aviator wings (simplified) -->
  <g transform="translate(531 452)">
    <!-- left wing -->
    <g fill="url(#gold)">
      <path d="M-46 -22 C-110 -40 -190 -52 -262 -48 C-236 -36 -212 -30 -190 -24 C-214 -20 -236 -14 -254 -4 C-224 -6 -198 -6 -174 -2 C-194 4 -212 12 -226 22 C-198 18 -170 16 -146 18 C-160 26 -172 34 -180 44 C-150 36 -118 30 -92 30 C-80 24 -62 14 -46 6 Z"/>
      <path d="M46 -22 C110 -40 190 -52 262 -48 C236 -36 212 -30 190 -24 C214 -20 236 -14 254 -4 C224 -6 198 -6 174 -2 C194 4 212 12 226 22 C198 18 170 16 146 18 C160 26 172 34 180 44 C150 36 118 30 92 30 C80 24 62 14 46 6 Z"/>
    </g>
    <!-- anchor behind shield -->
    <g stroke="#d9ad4a" stroke-width="12" fill="none" stroke-linecap="round">
      <line x1="0" y1="-92" x2="0" y2="96"/>
      <line x1="-30" y1="-70" x2="30" y2="-70"/>
      <path d="M-46 66 Q-36 104 0 108 Q36 104 46 66"/>
    </g>
    <circle cx="0" cy="-104" r="13" fill="none" stroke="#e6c165" stroke-width="9"/>
    <!-- shield -->
    <path d="M-40 -48 H40 V8 Q40 52 0 70 Q-40 52 -40 8 Z" fill="url(#gold)"/>
    <path d="M-30 -38 H30 V-14 H-30 Z" fill="#14305e"/>
    <g fill="#14305e">
      <rect x="-26" y="-6" width="8" height="58"/>
      <rect x="-10" y="-6" width="8" height="66"/>
      <rect x="6" y="-6" width="8" height="64"/>
      <rect x="22" y="-6" width="6" height="44"/>
    </g>
  </g>
  <!-- title -->
  <text x="531" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" letter-spacing="10" fill="url(#gold)">BLUE</text>
  <text x="531" y="790" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" letter-spacing="10" fill="url(#gold)">BOOK</text>
  <line x1="380" y1="610" x2="682" y2="610" stroke="#d9ad4a" stroke-width="4"/>
</svg>
