name: JobJar
options:
  bundleIdPrefix: com.dfwilley
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JobJar:
    type: application
    platform: iOS
    sources: [JobJar]
    info:
      path: JobJar/Info.plist
      properties:
        CFBundleDisplayName: The Job Jar!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: The Job Jar! uses your Wi-Fi to keep a grown-up's device and a kid's device in step. Nothing is sent over the internet.
        NSBonjourServices: [_jobjar._tcp, _jobjar._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dfwilley.jobjar
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  JobJarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JobJarTests]
    dependencies:
      - target: JobJar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  JobJarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JobJarUITests]
    dependencies:
      - target: JobJar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  JobJar:
    build:
      targets:
        JobJar: all
    test:
      targets:
        - JobJarTests
        - JobJarUITests
