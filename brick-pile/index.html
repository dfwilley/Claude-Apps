<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brick Pile</title>
  <meta name="description" content="Take a picture of your loose building bricks, get a list of what you have, and get ideas for things to build with them.">
  <!-- Nothing leaves the device unless you save your own Anthropic key; then the only outside address the page may reach is Anthropic's. Everything else is blocked. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.anthropic.com; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'self'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brick Pile">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFF6DC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130C" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>
  <noscript>Brick Pile needs JavaScript turned on.</noscript>
  <script src="core.js"></script>
  <script src="finder.js"></script>
  <script src="builds.js"></script>
  <script src="app.js"></script>
</body>
</html>
