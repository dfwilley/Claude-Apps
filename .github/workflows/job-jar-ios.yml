name: The Job Jar! iPhone/iPad app

on:
  push:
    branches: [main]
    paths: ["native/job-jar/**", "job-jar/core.js", "tests/job-jar.test.js", ".github/workflows/job-jar-ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the chore and star rules shared with the web version
        run: node tests/job-jar.test.js

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Create the Xcode project
        working-directory: native/job-jar
        run: xcodegen generate

      - name: Run tests and take screenshots on an iPhone simulator
        working-directory: native/job-jar
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "::notice::Simulator: $DEVICE"
          xcodebuild test \
            -project JobJar.xcodeproj -scheme JobJar \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -E "Test Suite .*(passed|failed)|Executed [0-9]+ test" test.log | sort -u | while IFS= read -r l; do echo "::notice::$l"; done
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" test.log; then
            grep -E "error:|: error|failed|xcodebuild: error" test.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Take screenshots on an iPad simulator
        if: always()
        working-directory: native/job-jar
        run: |
          IPAD=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPad' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "::notice::iPad simulator: $IPAD"
          xcodebuild test \
            -project JobJar.xcodeproj -scheme JobJar \
            -destination "platform=iOS Simulator,name=$IPAD" \
            -only-testing:JobJarUITests/ScreenshotTests/testMainScreens \
            -resultBundlePath iPadResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ipad.log | grep -E "error:|Test Case .*(passed|failed)|\*\* TEST" || true

      - name: Publish screenshots to the ci-screenshots-jobjar branch
        if: always()
        working-directory: native/job-jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots/iphone shots/ipad
          [ -d TestResults.xcresult ] && xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots/iphone || true
          [ -d iPadResults.xcresult ] && xcrun xcresulttool export attachments --path iPadResults.xcresult --output-path shots/ipad || true
          ls -R shots | head -60
          cd shots
          git init -q -b ci-screenshots-jobjar
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from run ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screenshots-jobjar

      - name: Build for iPhone and iPad (unsigned)
        working-directory: native/job-jar
        run: |
          xcodebuild build \
            -project JobJar.xcodeproj -scheme JobJar \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then
            grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Package the .ipa
        working-directory: native/job-jar
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JobJar.app Payload/
          zip -qry Job-Jar.ipa Payload
          ls -l Job-Jar.ipa

      - name: Publish the .ipa (always at the same download link)
        working-directory: native/job-jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete job-jar-latest --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create job-jar-latest Job-Jar.ipa --repo "${{ github.repository }}" \
            --title "The Job Jar! (build ${{ github.run_number }})" --latest=false \
            --notes "Download Job-Jar.ipa below and install it with Sideloadly. For TestFlight, see the 'The Job Jar! - upload to TestFlight' workflow. Built from commit ${GITHUB_SHA:0:7}."
